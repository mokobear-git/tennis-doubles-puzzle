<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1b2a">
<title>ダブルス次の一手</title>
<meta name="description" content="テニスのダブルスで、1ポイントの中の「次の1手」を考える詰将棋風トレーニング">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main id="home">
  <div class="hero">
    <h1>🎾 ダブルス次の一手</h1>
    <p>サーブからのラリーが再生され、<b>あなたが打つ直前</b>で止まります。次の一手を選ぶと、相手の返球と味方の動きが再生され、同じポイントの次の場面へ。</p>
  </div>
  <details class="how">
    <summary>画面の見かた</summary>
    <ul>
      <li>黄色の「私」があなた。「味」は味方、赤が相手A・B。</li>
      <li>ボールは高さに応じて浮き上がり、地面に影が出ます。白い輪はバウンド地点。</li>
      <li>軌跡のドットは一定時間ごと。<b>間隔が広い＝速い</b>、狭い＝遅い。</li>
      <li>上の小さなグラフは横から見た弾道（ネットの高さも表示）。ロブは高く、スライスは低く伸びます。</li>
      <li>色は球種：</li>
    </ul>
    <div id="legend"></div>
  </details>
  <div id="list"></div>
  <p class="foot">各場面 ◎2点 / △1点 / ✕0点。球速・弾道はイメージです。</p>
</main>

<section id="play" hidden>
  <header class="bar">
    <button id="back" aria-label="一覧へ">‹</button>
    <div id="ttl"></div>
    <button id="spd">速度 ×1</button>
  </header>
  <div id="dots"></div>
  <div id="hud"><div id="chip"></div><canvas id="side"></canvas></div>
  <div id="stage"><canvas id="court"></canvas><button id="skip" hidden>⏩ スキップ</button><button id="rp">↻ ラリー再生</button></div>
  <div id="panel"></div>
</section>

<script src="js/engine.js"></script>
<script src="js/problems1.js"></script>
<script src="js/problems1b.js"></script>
<script src="js/problems2.js"></script>
<script src="js/problems3.js"></script>
<script src="js/problems4.js"></script>
<script src="js/app.js"></script>
</body>
</html>
